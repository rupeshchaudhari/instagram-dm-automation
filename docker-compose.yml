# ============================================================
# Instagram DM Automation — Docker Compose
# Local development orchestration
# ============================================================
# Usage:
#   cp .env.example .env    # Fill in your secrets
#   docker-compose up -d    # Start all services
#   docker-compose logs -f  # Follow logs
# ============================================================

services:

  # ==========================================
  # PostgreSQL — Primary data store
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: igdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igdm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_password}
      POSTGRES_DB: ${POSTGRES_DB:-igdm_automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igdm_admin} -d ${POSTGRES_DB:-igdm_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - igdm-network

  # ==========================================
  # RabbitMQ — Message broker
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: igdm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-igdm_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - igdm-network

  # ==========================================
  # Webhook Receiver — Node.js (Express)
  # Ultra-fast ingestion of Meta webhook events
  # ==========================================
  webhook-receiver:
    build:
      context: ./webhook-receiver
      dockerfile: Dockerfile
    container_name: igdm-webhook
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEBHOOK_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-igdm_rabbit}:${RABBITMQ_DEFAULT_PASS:-changeme_rabbit_password}@rabbitmq:5672
    ports:
      - "${WEBHOOK_PORT:-3000}:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - igdm-network

  # ==========================================
  # Worker Service — Spring Boot (Java 21)
  # Business logic, API, DB operations
  # ==========================================
  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: igdm-worker
    restart: unless-stopped
    environment:
      WORKER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-igdm_automation}
      POSTGRES_USER: ${POSTGRES_USER:-igdm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-igdm_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit_password}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_at_least_32_chars_long}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "${WORKER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - igdm-network

  # ==========================================
  # Frontend Dashboard — Next.js 14 (React)
  # SaaS Web Application Dashboard
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: igdm-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - worker-service
    networks:
      - igdm-network

  # ==========================================
  # Nginx — Unified Reverse Proxy Gateway
  # Entrypoint on Port 80 for all services
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: igdm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - webhook-receiver
      - worker-service
    networks:
      - igdm-network

# ==========================================
# Volumes — Persistent data
# ==========================================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  igdm-network:
    driver: bridge
